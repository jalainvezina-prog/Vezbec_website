<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Bar -->
  <rect x="30" y="25" width="740" height="60" rx="12" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
  <text x="50" y="60" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="700">LogistiQ — Scan & Entrepôt Principal (Zone A-14)</text>
  <rect x="610" y="42" width="140" height="26" rx="6" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1"/>
  <text x="625" y="59" fill="#38BDF8" font-family="Inter, sans-serif" font-size="11" font-weight="600">4 120 SKU EN STOCK</text>

  <!-- Left: Barcode Scanner Viewfinder -->
  <rect x="30" y="105" width="340" height="365" rx="12" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
  <text x="50" y="135" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" font-weight="600">VISEUR OPTIQUE CAMÉRA</text>

  <rect x="50" y="150" width="300" height="220" rx="10" fill="#090E17" stroke="#38BDF8" stroke-width="1"/>
  <!-- Viewfinder corners -->
  <path d="M80 190 H110 M80 190 V220" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M320 190 H290 M320 190 V220" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M80 310 H110 M80 310 V280" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M320 310 H290 M320 310 V280" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <!-- Red/Cyan laser line -->
  <line x1="70" y1="250" x2="330" y2="250" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="130" y="270" fill="#38BDF8" font-family="Inter, sans-serif" font-size="11" font-weight="600">ALIGNER LE CODE-BARRES</text>

  <!-- Scan Result Pill -->
  <rect x="50" y="390" width="300" height="55" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="65" y="412" fill="#10B981" font-family="Inter, sans-serif" font-size="11" font-weight="700">DÉTECTÉ : EAN-13 #7240192841</text>
  <text x="65" y="430" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12">Vérin Hydraulique 450mm • Réf : VH-450</text>

  <!-- Right: Real-time Stock Ledger -->
  <rect x="390" y="105" width="380" height="365" rx="12" fill="#1E293B" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
  <text x="410" y="135" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" font-weight="600">DERNIÈRES TRANSACTIONS SCAN</text>

  <rect x="410" y="150" width="340" height="65" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="425" y="173" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="600">Palette Ciment Armé 25kg (x48)</text>
  <text x="425" y="195" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Emplacement : Allée B-04 • Opérateur : Dave L.</text>
  <rect x="660" y="163" width="75" height="22" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
  <text x="673" y="178" fill="#10B981" font-family="Inter, sans-serif" font-size="10" font-weight="700">+ ENTRÉE</text>

  <rect x="410" y="225" width="340" height="65" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="425" y="248" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="600">Raccord Cuivre 1/2" (x200)</text>
  <text x="425" y="270" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Commande Chantier #1049 • Opérateur : Alex P.</text>
  <rect x="660" y="238" width="75" height="22" rx="4" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
  <text x="675" y="253" fill="#38BDF8" font-family="Inter, sans-serif" font-size="10" font-weight="700">- SORTIE</text>

  <rect x="410" y="300" width="340" height="65" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1" stroke-opacity="0.5"/>
  <text x="425" y="323" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="600">Câble Cuivre Cat6 305m</text>
  <text x="425" y="345" fill="#EF4444" font-family="Inter, sans-serif" font-size="11">STOCK CRITIQUE : 2 restants (Seuil : 10)</text>
  <rect x="660" y="313" width="75" height="22" rx="4" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1"/>
  <text x="675" y="328" fill="#EF4444" font-family="Inter, sans-serif" font-size="10" font-weight="700">ALERTE</text>

  <rect x="410" y="385" width="340" height="45" rx="8" fill="url(#cyanG)"/>
  <text x="490" y="413" fill="#04101A" font-family="Inter, sans-serif" font-size="13" font-weight="700">EXPÉDIER LE BON DE COMMANDE</text>
</svg>