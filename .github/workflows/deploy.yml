name: CI/CD Pipeline - Production Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Sécurisation des permissions GITHUB_TOKEN selon le principe de moindre privilège
permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  qualite-et-tests:
    name: Validation & Tests de Qualité
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Installation des dépendances
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Vérification TypeScript (si projet TS)
        if: hashFiles('tsconfig.json') != ''
        run: npx tsc --noEmit

      - name: Linting ESLint (si configuré)
        if: hashFiles('.eslintrc*', 'eslint.config.*') != ''
        run: npm run lint

  deploiement-firebase:
    name: Déploiement Règles & Sécurité Firebase (GCP)
    needs: qualite-et-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Déploiement des Règles Firestore et Storage
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules,storage:rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

  deploiement-vercel:
    name: Déploiement Production Vercel
    needs: deploiement-firebase
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation de Vercel CLI
        run: npm install --global vercel@latest

      - name: Récupération de l'environnement Vercel Production
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Compilation des artefacts de Production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Déploiement précompilé sur Edge Network
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

